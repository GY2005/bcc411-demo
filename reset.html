<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>重置密码 Reset Password - 基督旌旗411教会</title>
  <meta name="description" content="设置新密码。 Choose a new password." />
  <meta property="og:title" content="重置密码 Reset Password - 基督旌旗411教会" />
  <meta property="og:description" content="设置新密码。 Choose a new password." />
  <meta property="og:site_name" content="基督旌旗411教会 Banner of Christ Church 411" />
  <script src="/bcc411-demo/lang-init.js"></script>
  <link rel="icon" type="image/png" href="/bcc411-demo/favicon.png" />
  <script type="module" crossorigin src="/bcc411-demo/assets/reset-V9t-Kw_9.js"></script>
  <link rel="modulepreload" crossorigin href="/bcc411-demo/assets/nav-Bhth8lqx.js">
  <link rel="modulepreload" crossorigin href="/bcc411-demo/assets/authForms-Cby3tvdZ.js">
  <link rel="stylesheet" crossorigin href="/bcc411-demo/assets/nav-Bddqj_YJ.css">
</head>
<body data-page="reset">
  <div id="site-header"></div>

  <main id="main">

  <section class="auth-section">
    <div class="wrap auth-wrap">
      <div class="card auth-card" id="reset-card">
        <span class="eyebrow"><span class="l-zh" lang="zh-Hans">账户</span> <span class="l-en" lang="en">Account</span></span>
        <h1 class="auth-title"><span class="l-zh" lang="zh-Hans">重置密码</span> <span class="l-en" lang="en">Reset Password</span></h1>
        <p class="lead small"><span class="l-zh" lang="zh-Hans">请设置新密码。</span> <span class="l-en" lang="en">Choose a new password for your account.</span></p>

        <form class="auth-form" id="reset-form" novalidate>
          <div class="form-field">
            <label for="new-password"><span class="l-zh" lang="zh-Hans">新密码</span> <span class="l-en" lang="en">New Password</span></label>
            <input type="password" id="new-password" name="new-password" autocomplete="new-password" required maxlength="128" />
            <p class="field-hint"><span class="l-zh" lang="zh-Hans">至少 10 个字符。</span> <span class="l-en" lang="en">At least 10 characters.</span></p>
            <p class="field-error" id="new-password-error" hidden></p>
          </div>
          <div class="form-field">
            <label for="confirm-password"><span class="l-zh" lang="zh-Hans">确认密码</span> <span class="l-en" lang="en">Confirm Password</span></label>
            <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required />
            <p class="field-error" id="confirm-password-error" hidden></p>
          </div>

          <div class="form-status" id="form-status" role="status" hidden></div>

          <button type="submit" class="btn primary full" id="submit-btn"><span class="l-zh" lang="zh-Hans">重置密码</span> <span class="l-en" lang="en">Reset Password</span></button>
        </form>

        <p class="lead small auth-links"><a href="login.html"><span class="l-zh" lang="zh-Hans">返回登录</span> <span class="l-en" lang="en">Back to log in</span></a></p>
      </div>
    </div>
  </section>

  </main>

  <div id="site-footer"></div>

</body>
</html>

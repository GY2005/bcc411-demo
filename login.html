<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 Log In - 基督旌旗411教会</title>
  <meta name="description" content="登录您的基督旌旗411教会账户。 Log in to your Banner of Christ Church 411 account." />
  <meta property="og:title" content="登录 Log In - 基督旌旗411教会" />
  <meta property="og:description" content="登录您的基督旌旗411教会账户。 Log in to your Banner of Christ Church 411 account." />
  <meta property="og:site_name" content="基督旌旗411教会 Banner of Christ Church 411" />
  <script src="/bcc411-demo/lang-init.js"></script>
  <link rel="icon" type="image/png" href="/bcc411-demo/favicon.png" />
  <script type="module" crossorigin src="/bcc411-demo/assets/login-D2HsSEMu.js"></script>
  <link rel="modulepreload" crossorigin href="/bcc411-demo/assets/nav-Bhth8lqx.js">
  <link rel="modulepreload" crossorigin href="/bcc411-demo/assets/authForms-Cby3tvdZ.js">
  <link rel="stylesheet" crossorigin href="/bcc411-demo/assets/nav-Bddqj_YJ.css">
</head>
<body data-page="login">
  <div id="site-header"></div>

  <main id="main">

  <section class="auth-section">
    <div class="wrap auth-wrap">
      <div class="card auth-card">
        <span class="eyebrow"><span class="l-zh" lang="zh-Hans">账户</span> <span class="l-en" lang="en">Account</span></span>
        <h1 class="auth-title"><span class="l-zh" lang="zh-Hans">登录</span> <span class="l-en" lang="en">Log In</span></h1>
        <p class="lead small"><span class="l-zh" lang="zh-Hans">欢迎回来，请输入邮箱和密码。</span> <span class="l-en" lang="en">Welcome back. Enter your email and password.</span></p>

        <form class="auth-form" id="login-form" novalidate>
          <div class="form-field">
            <label for="email"><span class="l-zh" lang="zh-Hans">邮箱</span> <span class="l-en" lang="en">Email</span></label>
            <input type="email" id="email" name="email" autocomplete="email" required />
            <p class="field-error" id="email-error" hidden></p>
          </div>
          <div class="form-field">
            <label for="password"><span class="l-zh" lang="zh-Hans">密码</span> <span class="l-en" lang="en">Password</span></label>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
            <p class="field-error" id="password-error" hidden></p>
          </div>

          <div class="form-status" id="form-status" role="status" hidden></div>

          <button type="submit" class="btn primary full" id="submit-btn"><span class="l-zh" lang="zh-Hans">登录</span> <span class="l-en" lang="en">Log In</span></button>
        </form>

        <p class="lead small auth-links">
          <a href="forgot.html"><span class="l-zh" lang="zh-Hans">忘记密码？</span> <span class="l-en" lang="en">Forgot password?</span></a> · <a href="register.html"><span class="l-zh" lang="zh-Hans">注册账户</span> <span class="l-en" lang="en">Create an account</span></a>
        </p>
      </div>
    </div>
  </section>

  </main>

  <div id="site-footer"></div>

</body>
</html>

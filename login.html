<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log In 登录 — BCC411</title>
  <meta name="description" content="Log in to your Banner of Christ Church 411 account." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/bcc411-demo/assets/login-BrskEyOW.js"></script>
  <link rel="modulepreload" crossorigin href="/bcc411-demo/assets/nav-Dk7rOftf.js">
  <link rel="modulepreload" crossorigin href="/bcc411-demo/assets/authForms-Cav43f7r.js">
  <link rel="stylesheet" crossorigin href="/bcc411-demo/assets/nav-BrESBVsN.css">
</head>
<body data-page="login">
  <div id="site-header"></div>

  <section class="auth-section">
    <div class="wrap auth-wrap">
      <div class="card auth-card">
        <span class="eyebrow">Account · <span class="zh">账户</span></span>
        <h2>Log In <span class="zh">登录</span></h2>
        <p class="lead small">Welcome back — enter your email and password.</p>

        <form class="auth-form" id="login-form" novalidate>
          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
            <p class="field-error" id="email-error" hidden></p>
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
            <p class="field-error" id="password-error" hidden></p>
          </div>

          <div class="form-status" id="form-status" role="status" hidden></div>

          <button type="submit" class="btn crimson full" id="submit-btn">Log In</button>
        </form>

        <p class="lead small auth-links">
          <a href="forgot.html">Forgot password?</a> · <a href="register.html">Create an account</a>
        </p>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

</body>
</html>

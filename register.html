<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create an Account 注册账户 — BCC411</title>
  <meta name="description" content="Create a Banner of Christ Church 411 account." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/bcc411-demo/assets/register-DxG4jXHH.js"></script>
  <link rel="modulepreload" crossorigin href="/bcc411-demo/assets/nav-Dk7rOftf.js">
  <link rel="modulepreload" crossorigin href="/bcc411-demo/assets/authForms-Cav43f7r.js">
  <link rel="stylesheet" crossorigin href="/bcc411-demo/assets/nav-BrESBVsN.css">
</head>
<body data-page="register">
  <div id="site-header"></div>

  <section class="auth-section">
    <div class="wrap auth-wrap">
      <div class="card auth-card" id="register-card">
        <span class="eyebrow">Account · <span class="zh">账户</span></span>
        <h2>Create an Account <span class="zh">注册账户</span></h2>
        <p class="lead small">Sign up with your email — we'll send a verification link before you can log in.</p>

        <form class="auth-form" id="register-form" novalidate>
          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
            <p class="field-error" id="email-error" hidden></p>
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required maxlength="128" />
            <p class="field-hint">At least 10 characters.</p>
            <p class="field-error" id="password-error" hidden></p>
          </div>
          <div class="form-field">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required />
            <p class="field-error" id="confirm-password-error" hidden></p>
          </div>

          <div class="form-status" id="form-status" role="status" hidden></div>

          <button type="submit" class="btn crimson full" id="submit-btn">Create Account</button>
        </form>

        <p class="lead small auth-links">
          Already have an account? <a href="login.html">Log in</a>
        </p>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

</body>
</html>

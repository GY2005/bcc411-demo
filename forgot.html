<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>忘记密码 Forgot Password - 基督旌旗411教会</title>
  <meta name="description" content="重置您的密码。 Reset your password." />
  <meta property="og:title" content="忘记密码 Forgot Password - 基督旌旗411教会" />
  <meta property="og:description" content="重置您的密码。 Reset your password." />
  <meta property="og:site_name" content="基督旌旗411教会 Banner of Christ Church 411" />
  <script src="/bcc411-demo/lang-init.js"></script>
  <link rel="icon" type="image/png" href="/bcc411-demo/favicon.png" />
  <script type="module" crossorigin src="/bcc411-demo/assets/forgot-DVRqwGrw.js"></script>
  <link rel="modulepreload" crossorigin href="/bcc411-demo/assets/nav-Bhth8lqx.js">
  <link rel="modulepreload" crossorigin href="/bcc411-demo/assets/authForms-Cby3tvdZ.js">
  <link rel="stylesheet" crossorigin href="/bcc411-demo/assets/nav-Bddqj_YJ.css">
</head>
<body data-page="forgot">
  <div id="site-header"></div>

  <main id="main">

  <section class="auth-section">
    <div class="wrap auth-wrap">
      <div class="card auth-card" id="forgot-card">
        <span class="eyebrow"><span class="l-zh" lang="zh-Hans">账户</span> <span class="l-en" lang="en">Account</span></span>
        <h1 class="auth-title"><span class="l-zh" lang="zh-Hans">忘记密码</span> <span class="l-en" lang="en">Forgot Password</span></h1>
        <p class="lead small"><span class="l-zh" lang="zh-Hans">请输入邮箱，我们会发送重置密码的链接。</span> <span class="l-en" lang="en">Enter your email and we will send you a link to reset your password.</span></p>

        <form class="auth-form" id="forgot-form" novalidate>
          <div class="form-field">
            <label for="email"><span class="l-zh" lang="zh-Hans">邮箱</span> <span class="l-en" lang="en">Email</span></label>
            <input type="email" id="email" name="email" autocomplete="email" required />
            <p class="field-error" id="email-error" hidden></p>
          </div>

          <div class="form-status" id="form-status" role="status" hidden></div>

          <button type="submit" class="btn primary full" id="submit-btn"><span class="l-zh" lang="zh-Hans">发送重置链接</span> <span class="l-en" lang="en">Send Reset Link</span></button>
        </form>

        <p class="lead small auth-links"><a href="login.html"><span class="l-zh" lang="zh-Hans">返回登录</span> <span class="l-en" lang="en">Back to log in</span></a></p>
      </div>
    </div>
  </section>

  </main>

  <div id="site-footer"></div>

</body>
</html>

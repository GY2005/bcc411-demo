<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>注册账户 Create an Account - 基督旌旗411教会</title>
  <meta name="description" content="注册基督旌旗411教会账户。 Create a Banner of Christ Church 411 account." />
  <meta property="og:title" content="注册账户 Create an Account - 基督旌旗411教会" />
  <meta property="og:description" content="注册基督旌旗411教会账户。 Create a Banner of Christ Church 411 account." />
  <meta property="og:site_name" content="基督旌旗411教会 Banner of Christ Church 411" />
  <script src="/bcc411-demo/lang-init.js"></script>
  <link rel="icon" type="image/png" href="/bcc411-demo/favicon.png" />
  <script type="module" crossorigin src="/bcc411-demo/assets/register-DDh-NsnN.js"></script>
  <link rel="modulepreload" crossorigin href="/bcc411-demo/assets/nav-Bhth8lqx.js">
  <link rel="modulepreload" crossorigin href="/bcc411-demo/assets/authForms-Cby3tvdZ.js">
  <link rel="stylesheet" crossorigin href="/bcc411-demo/assets/nav-Bddqj_YJ.css">
</head>
<body data-page="register">
  <div id="site-header"></div>

  <main id="main">

  <section class="auth-section">
    <div class="wrap auth-wrap">
      <div class="card auth-card" id="register-card">
        <span class="eyebrow"><span class="l-zh" lang="zh-Hans">账户</span> <span class="l-en" lang="en">Account</span></span>
        <h1 class="auth-title"><span class="l-zh" lang="zh-Hans">注册账户</span> <span class="l-en" lang="en">Create an Account</span></h1>
        <p class="lead small"><span class="l-zh" lang="zh-Hans">用邮箱注册。我们会发送验证链接，验证后即可登录。</span> <span class="l-en" lang="en">Sign up with your email. We will send a verification link before you can log in.</span></p>

        <form class="auth-form" id="register-form" novalidate>
          <div class="form-field">
            <label for="email"><span class="l-zh" lang="zh-Hans">邮箱</span> <span class="l-en" lang="en">Email</span></label>
            <input type="email" id="email" name="email" autocomplete="email" required />
            <p class="field-error" id="email-error" hidden></p>
          </div>
          <div class="form-field">
            <label for="password"><span class="l-zh" lang="zh-Hans">密码</span> <span class="l-en" lang="en">Password</span></label>
            <input type="password" id="password" name="password" autocomplete="new-password" required maxlength="128" />
            <p class="field-hint"><span class="l-zh" lang="zh-Hans">至少 10 个字符。</span> <span class="l-en" lang="en">At least 10 characters.</span></p>
            <p class="field-error" id="password-error" hidden></p>
          </div>
          <div class="form-field">
            <label for="confirm-password"><span class="l-zh" lang="zh-Hans">确认密码</span> <span class="l-en" lang="en">Confirm Password</span></label>
            <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required />
            <p class="field-error" id="confirm-password-error" hidden></p>
          </div>

          <div class="form-status" id="form-status" role="status" hidden></div>

          <button type="submit" class="btn primary full" id="submit-btn"><span class="l-zh" lang="zh-Hans">注册</span> <span class="l-en" lang="en">Create Account</span></button>
        </form>

        <p class="lead small auth-links">
          <span class="l-zh" lang="zh-Hans">已有账户？</span> <span class="l-en" lang="en">Already have an account?</span> <a href="login.html"><span class="l-zh" lang="zh-Hans">登录</span> <span class="l-en" lang="en">Log in</span></a>
        </p>
      </div>
    </div>
  </section>

  </main>

  <div id="site-footer"></div>

</body>
</html>
